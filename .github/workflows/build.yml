name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # Pinned so a new tool release cannot turn a green branch red on its own.
      - name: Install golangci-lint
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Install nilaway
        env:
          GOTOOLCHAIN: auto
        run: go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20261112030514-ccd005690d1e
      - name: Check dependencies
        run: make tidy-check
      - name: Build
        run: make build
      - name: Lint
        run: GOWORK=off make lint
      - name: Test
        run: make test
      # Race detector over the whole module; a clean run takes about a minute.
      - name: Test (race)
        run: go test -race ./...
      # apidiff is fetched with `go run`; the baseline release is resolved
      # through the module proxy, so no extra tool install is needed.
      - name: API compatibility
        run: make api-compat
