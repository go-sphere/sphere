name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # Library module: dependencies, compile, then tests. `make check` would
      # also run golangci-lint/nilaway, which need a separate tool install.
      - name: Check dependencies
        run: make tidy-check
      - name: Build
        run: make build
      - name: Test
        run: make test
      # Race detector over the whole module; a clean run takes about a minute.
      - name: Test (race)
        run: go test -race ./...
      # apidiff is fetched with `go run`; the baseline release is resolved
      # through the module proxy, so no extra tool install is needed.
      - name: API compatibility
        run: make api-compat
