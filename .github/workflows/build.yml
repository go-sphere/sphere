name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # Library module: dependencies, compile, then tests. `make check` would
      # also run golangci-lint/nilaway, which need a separate tool install.
      - name: Check dependencies
        run: make tidy-check
      - name: Build
        run: make build
      - name: Test
        run: make test
